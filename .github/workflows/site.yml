name: Site CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this main-branch build to production after staging
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-site/package-lock.json

      - name: Install locked dependencies
        working-directory: react-site
        run: npm ci

      - name: Check dependency advisories
        working-directory: react-site
        run: npm audit --audit-level=high

      - name: Build production site
        working-directory: react-site
        run: npm run build

      - name: Lint CloudFormation templates
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint==1.57.2
          cfn-lint infrastructure/template.yaml infrastructure/github-oidc.yaml --non-zero-exit-code error

      - name: Install pinned CloudFormation Guard
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cfn-guard.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            'https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-linux-latest.tar.gz' \
            --output "$archive"
          echo '8c66efb19c63e6c2bf26b9a41bbcf2f85baa8a937b01d350940194faaf64cf1d  '"$archive" | sha256sum --check --status
          install_dir="$RUNNER_TEMP/cfn-guard-bin"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          chmod +x "$install_dir/cfn-guard"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check infrastructure security rules
        shell: bash
        run: "$RUNNER_TEMP/cfn-guard-bin/cfn-guard validate --rules .github/security/cloudformation.guard --data infrastructure/template.yaml --data infrastructure/github-oidc.yaml"

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the local Docker image
        run: docker build --file react-site/Dockerfile --tag apocalypse-inside-ci .

      - name: Upload the verified site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apocalypse-inside-site
          path: react-site/dist/
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL analysis
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

  deploy-staging:
    name: Deploy staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: [validate]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deployment-staging
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: react-site
        run: npm ci
      - name: Download verified site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apocalypse-inside-site
          path: react-site/dist
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: SiteStaging-${{ github.run_id }}
      - name: Create or update staging infrastructure
        run: >-
          aws cloudformation deploy
          --template-file infrastructure/template.yaml
          --stack-name apocalypse-inside-staging
          --change-set-name apocalypse-inside-staging-${{ github.run_id }}
          --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}"
          --capabilities CAPABILITY_NAMED_IAM
          --parameter-overrides
          EnvironmentName=staging
          SiteDomainName=staging.apocalypseinsi.de
          HostedZoneId=${{ vars.AWS_HOSTED_ZONE_ID }}
          CreateDnsRecords=true
          --no-fail-on-empty-changeset
      - name: Publish site and media
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name apocalypse-inside-staging --query 'Stacks[0].Outputs[?OutputKey==`SiteBucket`].OutputValue | [0]' --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name apocalypse-inside-staging --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue | [0]' --output text)"
          aws s3 sync react-site/dist/ "s3://${bucket}/" --delete --cache-control 'public,max-age=604800' --only-show-errors
          aws s3 cp react-site/dist/assets/ "s3://${bucket}/assets/" --recursive --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          if [ -d react-site/dist/media ]; then
            aws s3 cp react-site/dist/media/ "s3://${bucket}/media/" --recursive --cache-control 'public,max-age=604800' --only-show-errors
          fi
          aws s3 cp react-site/dist/index.html "s3://${bucket}/index.html" --cache-control 'no-cache,no-store,must-revalidate' --content-type 'text/html; charset=utf-8' --only-show-errors
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
      - name: Verify staging website and security headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://staging.apocalypseinsi.de'
          for path in / /backstory /codename-nebula /sarif-industries; do
            curl --fail --silent --show-error --output /dev/null "$base$path"
          done
          headers="$(curl --fail --silent --show-error --head "$base/")"
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
            grep --quiet --ignore-case "^${header}:" <<< "$headers"
          done

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy_production)
    needs: [validate, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deployment-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: react-site
        run: npm ci
      - name: Download the same verified site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apocalypse-inside-site
          path: react-site/dist
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: SiteProduction-${{ github.run_id }}
      - name: Create or update production infrastructure and DNS
        run: >-
          aws cloudformation deploy
          --template-file infrastructure/template.yaml
          --stack-name apocalypse-inside-production
          --change-set-name apocalypse-inside-production-${{ github.run_id }}
          --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}"
          --capabilities CAPABILITY_NAMED_IAM
          --parameter-overrides
          EnvironmentName=production
          SiteDomainName=apocalypseinsi.de
          HostedZoneId=${{ vars.AWS_HOSTED_ZONE_ID }}
          CreateDnsRecords=true
          --no-fail-on-empty-changeset
      - name: Publish site and media
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(aws cloudformation describe-stacks --stack-name apocalypse-inside-production --query 'Stacks[0].Outputs[?OutputKey==`SiteBucket`].OutputValue | [0]' --output text)"
          distribution="$(aws cloudformation describe-stacks --stack-name apocalypse-inside-production --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue | [0]' --output text)"
          aws s3 sync react-site/dist/ "s3://${bucket}/" --delete --cache-control 'public,max-age=604800' --only-show-errors
          aws s3 cp react-site/dist/assets/ "s3://${bucket}/assets/" --recursive --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          if [ -d react-site/dist/media ]; then
            aws s3 cp react-site/dist/media/ "s3://${bucket}/media/" --recursive --cache-control 'public,max-age=604800' --only-show-errors
          fi
          aws s3 cp react-site/dist/index.html "s3://${bucket}/index.html" --cache-control 'no-cache,no-store,must-revalidate' --content-type 'text/html; charset=utf-8' --only-show-errors
          invalidation="$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
      - name: Verify production website and security headers
        shell: bash
        run: |
          set -euo pipefail
          base='https://apocalypseinsi.de'
          for path in / /backstory /codename-nebula /sarif-industries; do
            curl --fail --silent --show-error --output /dev/null "$base$path"
          done
          headers="$(curl --fail --silent --show-error --head "$base/")"
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options; do
            grep --quiet --ignore-case "^${header}:" <<< "$headers"
          done

services:
  apocalypse-inside:
    build:
      context: .
      dockerfile: react-site/Dockerfile
    ports:
      - "127.0.0.1:${APOCALYPSE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
